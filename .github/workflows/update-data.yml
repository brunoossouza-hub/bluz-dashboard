name: Atualizar Dados CNJ

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar e processar CSV do CNJ
        run: python scripts/process_cnj.py --inspecionar

      - name: Commitar dados atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add litigantes.json delta.json
          git diff --cached --quiet || git commit -m "chore: atualizar dados CNJ [$(date +'%Y-%m-%d')]"
          git push
